[project]
name = "bazaar-contrib-starlink"
version = "0.3.0rc1"
description = "A node's link to a Bazaar Compute server: taking its calls, answering them and reporting the node's audit events"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-audit~=0.3.0rc7",
    "bazaar-contrib-sidecar~=0.3.0rc7",
    "bazaar-contrib-timer~=0.3.0rc7",
    "aiohttp>=3.12.0",
    "pydantic>=2.12.0",
]

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-starlink"

[project.entry-points."bazaar_compute_node.contribs"]
starlink = "bazaar_contrib_starlink:starlink"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["tests/fixtures/probe/src"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[tool.uv.sources]
starlink-probe = { path = "tests/fixtures/probe", editable = true }

[dependency-groups]
dev = [
    "bazaar-contrib-server-computer~=0.3.0rc1",
    "bazaar-contrib-sidecar-unix~=0.3.0rc11; sys_platform != 'win32'",
    "bazaar-contrib-sidecar-windows~=0.3.0rc11; sys_platform == 'win32'",
    "bazaar-contrib-sqlite~=0.3.0rc1",
    "bazaar-contrib-timer-wheel~=0.3.0rc1",
    "blockbuster>=1.5.29,<1.6",
    "httpx>=0.28.0,<1",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "starlink-probe",
]
