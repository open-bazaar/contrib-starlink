[project]
name = "starlink-probe"
version = "0.1.0"
description = "Members a node exposes for the server to call, for starlink's tests"
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0rc1", "bazaar-contrib-sidecar~=0.3.0rc7", "bazaar-contrib-timer~=0.3.0rc7"]

[project.entry-points."bazaar_compute_node.contribs"]
probe = "starlink_probe:probe"

[project.entry-points."bazaar_compute_node.remotes"]
probe = "starlink_probe:remote"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
